name: Incident Correlation Shadow Runtime E2E

on:
  pull_request:
    branches:
      - feat/incident-correlation-shadow-v1-20260826
  workflow_dispatch:

jobs:
  runtime-e2e:
    name: PostgreSQL + Go API shadow E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pea_e2e
          POSTGRES_PASSWORD: pea_e2e_password
          POSTGRES_DB: pea_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pea_e2e -d pea_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://pea_e2e:pea_e2e_password@127.0.0.1:5432/pea_e2e?sslmode=disable
      AIS_INBOUND_API_KEY: synthetic-ais-e2e-key
      OUTAGE_INTEGRATION_API_KEY: synthetic-outage-e2e-key
      INCIDENT_CORRELATION_MODE: shadow
      PRODUCTION_SEND_MODE: blocked
      CALLBACK_TRANSPORT: dry_run
      EMERGENCY_OFF: "false"
      PLANNED_OUTAGE_MODE: off
      RATE_LIMIT_PER_MINUTE: "1000"
      PORT: "8090"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/api-go/go.sum

      - name: Start integrated shadow API
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api-go
          go run ./cmd/pea-api-intellisense > "$RUNNER_TEMP/pea-api-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pea-api-e2e.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/health > "$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health > "$RUNNER_TEMP/health.json"
          python3 - <<'PY'
          import json, os
          p = os.environ['RUNNER_TEMP'] + '/health.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['status'] == 'ok', d
          assert d['database'] == 'ok', d
          assert d['mode'] == 'shadow', d
          assert d['production_send'] == 'blocked', d
          sc = d['send_control']
          assert sc['mode'] == 'blocked', sc
          assert sc['callback_transport'] == 'dry_run', sc
          assert sc['production_send'] == 'blocked', sc
          print('E0 health/send guardrails PASS')
          PY

      - name: E0 auth and Phase-5 route preflight
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' \
            http://127.0.0.1:8090/api/v1/chatbot-reports/PEA-20260827-000001/correlation)
          test "$code" = "401"
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/unauth.json',encoding='utf-8'))
          assert d['error']['code'] == 'UNAUTHORIZED', d
          assert d['mode'] == 'shadow', d
          assert d['production_send'] == 'blocked', d
          print('E0 auth/route PASS')
          PY

      - name: Build synthetic chatbot fixtures
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/report1.json" <<'JSON'
          {
            "schema_version":"pea-chatbot-report.v1",
            "source":{
              "system":"n8n-pea-buengkan",
              "channel":"line",
              "event_id":"PEA-20260827-A1B2C3",
              "session_ref":"sha256:1111111111111111111111111111111111111111111111111111111111111111",
              "occurred_at":"2026-08-27T00:20:00+07:00"
            },
            "report":{
              "ticket_id":"PEA-20260827-A1B2C3",
              "service_type":"power_outage",
              "incident_detail":"ไฟดับ synthetic shadow e2e",
              "location":{
                "house_or_village":"บ้านดงหมากยาง หมู่ 7",
                "subdistrict":"บึงกาฬ",
                "district":"เมืองบึงกาฬ",
                "province":"บึงกาฬ"
              },
              "customer":{"name":"SYNTHETIC TEST ONLY","phone":"0000000000"},
              "confirmed":true,
              "completed_at":"2026-08-26T17:20:00Z"
            }
          }
          JSON
          cat > "$RUNNER_TEMP/report2.json" <<'JSON'
          {
            "schema_version":"pea-chatbot-report.v1",
            "source":{
              "system":"n8n-pea-buengkan",
              "channel":"chat",
              "event_id":"PEA-20260827-D4E5F6",
              "session_ref":"sha256:2222222222222222222222222222222222222222222222222222222222222222",
              "occurred_at":"2026-08-27T00:23:00+07:00"
            },
            "report":{
              "ticket_id":"PEA-20260827-D4E5F6",
              "service_type":"power_outage",
              "incident_detail":"ไฟดับ synthetic shadow e2e",
              "location":{
                "house_or_village":"บ้านดงหมากยาง หมู่ 7",
                "subdistrict":"บึงกาฬ",
                "district":"เมืองบึงกาฬ",
                "province":"บึงกาฬ"
              },
              "customer":{"name":"SYNTHETIC TEST ONLY","phone":"0000000000"},
              "confirmed":true,
              "completed_at":"2026-08-26T17:23:00Z"
            }
          }
          JSON

      - name: E1 single report and E2 idempotent retry
        shell: bash
        run: |
          set -euo pipefail
          post() {
            local input="$1" output="$2"
            curl -sS -o "$output" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'X-API-Key: synthetic-outage-e2e-key' \
              --data-binary "@$input" \
              http://127.0.0.1:8090/api/v1/chatbot-reports
          }
          c1=$(post "$RUNNER_TEMP/report1.json" "$RUNNER_TEMP/ack1.json")
          test "$c1" = "201"
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/ack1.json',encoding='utf-8'))
          assert d['accept_status']=='ACCEPTED', d
          assert d['bot_action']=='SHOW_ACK', d
          assert d['customer_message']['template_key']=='ACK', d
          assert d['duplicate'] is False, d
          assert d['context']['outage_state']=='UNDETERMINED', d
          print('E1 ACK PASS')
          PY
          c2=$(post "$RUNNER_TEMP/report1.json" "$RUNNER_TEMP/ack1_retry.json")
          test "$c2" = "200"
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/ack1_retry.json',encoding='utf-8'))
          assert d['accept_status']=='ACCEPTED', d
          assert d['duplicate'] is True, d
          print('E2 idempotent ACK PASS')
          PY

      - name: E3 second independent report and correlation convergence
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/ack2.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: synthetic-outage-e2e-key' \
            --data-binary "@$RUNNER_TEMP/report2.json" \
            http://127.0.0.1:8090/api/v1/chatbot-reports)
          test "$code" = "201"
          python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/ack2.json',encoding='utf-8'))
          assert d['accept_status']=='ACCEPTED', d
          assert d['duplicate'] is False, d
          assert d['context']['outage_state']=='UNDETERMINED', d
          print('second independent ACK PASS')
          PY

          for ticket in PEA-20260827-A1B2C3 PEA-20260827-D4E5F6; do
            out="$RUNNER_TEMP/correlation-${ticket}.json"
            for i in $(seq 1 30); do
              curl -fsS \
                -H 'X-API-Key: synthetic-outage-e2e-key' \
                "http://127.0.0.1:8090/api/v1/chatbot-reports/${ticket}/correlation" > "$out"
              state=$(python3 - "$out" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['correlation']['state'])
          PY
              )
              if [ "$state" != "PENDING" ]; then break; fi
              sleep 1
            done
          done

          python3 - <<'PY'
          import json, os
          root=os.environ['RUNNER_TEMP']
          docs=[]
          for ticket in ('PEA-20260827-A1B2C3','PEA-20260827-D4E5F6'):
              d=json.load(open(f'{root}/correlation-{ticket}.json',encoding='utf-8'))
              docs.append(d)
              assert d['schema_version']=='pea-chatbot-correlation-status.v1', d
              assert d['found'] is True, d
              assert d['correlation']['available'] is True, d
              assert d['correlation']['state']=='SUSPECTED_RELATED', d
              assert d['correlation']['report_count']==2, d
              assert d['bot_action']=='NO_CUSTOMER_ACTION', d
              assert d['customer_truth_changed'] is False, d
              assert d['operational_incident_confirmed'] is False, d
              assert d['root_cause_confirmed'] is False, d
              assert d['mode']=='shadow', d
              assert d['production_send']=='blocked', d
              assert 'confidence_score' not in d['correlation'], d
              assert str(d['correlation'].get('cluster_ref','')).startswith('correlation_cluster_'), d
          assert docs[0]['correlation']['cluster_ref'] == docs[1]['correlation']['cluster_ref'], docs
          print('E3 cross-channel suspected-related safe semantics PASS')
          PY

      - name: Database idempotency and durability assertions
        shell: bash
        run: |
          set -euo pipefail
          reports=$(PGPASSWORD=pea_e2e_password psql -h 127.0.0.1 -U pea_e2e -d pea_e2e -Atc 'select count(*) from correlation_reports;')
          test "$reports" = "2"
          active_memberships=$(PGPASSWORD=pea_e2e_password psql -h 127.0.0.1 -U pea_e2e -d pea_e2e -Atc "select count(*) from (select distinct on (report_id) report_id,membership_state from correlation_cluster_membership_revisions order by report_id,membership_revision desc) x where membership_state='ACTIVE';")
          test "$active_memberships" = "2"
          clusters=$(PGPASSWORD=pea_e2e_password psql -h 127.0.0.1 -U pea_e2e -d pea_e2e -Atc 'select count(*) from correlation_clusters;')
          test "$clusters" -ge 1
          echo "durability assertions PASS (2 logical reports, 2 active memberships, cluster persisted)"

      - name: Upload redacted runtime evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incident-correlation-shadow-runtime-e2e-failure
          path: |
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/unauth.json
            ${{ runner.temp }}/ack1.json
            ${{ runner.temp }}/ack1_retry.json
            ${{ runner.temp }}/ack2.json
            ${{ runner.temp }}/correlation-*.json
            ${{ runner.temp }}/pea-api-e2e.log
          retention-days: 3
